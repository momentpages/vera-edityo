<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <title>Vera &amp; Edityo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Great+Vibes&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="scene" aria-hidden="true">
      <div class="scene-bg"></div>
      <img class="gunungan gunungan-left" src="./assets/design/gunungan.png" alt="" />
      <img class="gunungan gunungan-right" src="./assets/design/gunungan.png" alt="" />
    </div>

    <main class="page">
      <section class="panel greeting-page is-current" aria-label="Salam">
        <div class="panel-inner">
          <div class="invite-card">
            <img class="lace-ring" src="./assets/design/circle-floral-background.svg" alt="" />
            <div class="invite-disc">
              <p class="kicker">Untuk</p>
              <p id="invitee-name" class="script guest-name"></p>
              <button type="button" class="open-btn" id="open-invite">Buka Undangan</button>
            </div>
          </div>
          <img class="rings" src="./assets/design/rings.png" alt="" />
        </div>
      </section>

      <section class="panel invite-page" aria-label="Undangan" aria-hidden="true">
        <div class="panel-inner">
          <div class="invite-card">
            <img class="lace-ring" src="./assets/design/circle-floral-background.svg" alt="" />
            <div class="invite-disc">
              <p id="invite-line" class="kicker invite-lead"></p>
              <p id="event-line" class="event-line"></p>
              <h1 class="names">
                <span id="person-a" class="script name"></span>
                <span class="and">&amp;</span>
                <span id="person-b" class="script name"></span>
              </h1>
              <div class="parents">
                <p id="person-a-parents" class="parent-line"></p>
                <p id="person-b-parents" class="parent-line"></p>
              </div>
              <div class="when">
                <span id="day-line" class="when-side"></span>
                <span class="when-medallion">
                  <span class="when-date">
                    <span id="date-day"></span>
                    <span id="date-month"></span>
                    <span id="date-year"></span>
                  </span>
                </span>
                <span id="time-line" class="when-side"></span>
              </div>
              <a id="maps-link" class="venue" href="#" target="_blank" rel="noopener noreferrer">
                <span class="venue-top">Lokasi: <span id="venue-name"></span></span>
                <span id="venue-address"></span>
              </a>
            </div>
          </div>
          <img class="rings" src="./assets/design/rings.png" alt="" />
        </div>
      </section>
    </main>

    <img class="jasmine-corner jasmine-corner--right" src="./assets/design/jasmine-flower.png" alt="" aria-hidden="true" />
    <img class="jasmine-corner jasmine-corner--left" src="./assets/design/jasmine-flower-left.png" alt="" aria-hidden="true" />

    <audio id="bg-music" loop preload="auto" playsinline></audio>
    <button type="button" class="sound-btn is-muted" id="sound-toggle" aria-label="Unmute music" aria-pressed="true">
      <svg class="icon-on" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4.4 9.2v5.6h3.1L12 19.2V4.8L7.5 9.2H4.4z" />
        <path d="M15.1 8.6c1.5 1.4 1.5 5.4 0 6.8" fill="none" />
        <path d="M17.6 6.2c2.6 2.4 2.6 9.2 0 11.6" fill="none" />
      </svg>
      <svg class="icon-off" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4.4 9.2v5.6h3.1L12 19.2V4.8L7.5 9.2H4.4z" />
        <path d="M15.2 9.2 20 14.8" fill="none" />
        <path d="M20 9.2 15.2 14.8" fill="none" />
      </svg>
    </button>
    <script src="./config.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
